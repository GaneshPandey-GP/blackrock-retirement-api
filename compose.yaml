services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: blk-hacking-ind-ganesh-pandey

    container_name: blackrock-retirement-api

    ports:
      - "5477:5477"

    environment:
      - APP_ENV=production
      - APP_PORT=5477

  
    restart: unless-stopped


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5477/blackrock/challenge/v1/performance"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s